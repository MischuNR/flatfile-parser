@if (store.isLoadingDocuments()) {
    <div role="status" aria-live="polite">Lade Dokumente...</div>
} @else {
    @if(store.loadDocumentsError(); as error) {
    <p class="error-message">
        Beim Laden der Daten ist ein Fehler aufgetreten:
        <br>
        {{error.message}}
    </p>
    <button class="btn" (click)="store.load()" role="button">Erneut versuchen</button>
    } @else {
        <router-outlet></router-outlet>
    }
}
