<div>
    <label class="btn" [class.disabled]="store.isUploading()" for="file-upload">Datei hochladen</label>
    <input id="file-upload"
           class="visually-hidden"
           type="file"
           [attr.aria-disabled]="store.isUploading()"
           (click)="preventOpeningFilesWhileUploading($event)"
           (change)="uploadFile($event)">
</div>

<div role="status" aria-live="polite">
    @if (store.isUploading()) {
        Datei wird hochgeladen...
    }
</div>

<div role="alert">
    @if (store.uploadError(); as error) {
        Beim Hochladen ist ein Fehler aufgetreten: {{ error.message }}
    }
</div>
