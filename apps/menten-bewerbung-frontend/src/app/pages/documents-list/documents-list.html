<div class="header">
    <div class="filter">
        <label for="status-filter">Status filtern</label>
        <select id="status-filter" (change)="changeStatusFilter($event)">
            @for (statusFilter of statusFilterArr; track statusFilter.value) {
                <option [value]="statusFilter.value" [selected]="store.statusFilter() === statusFilter.value">{{ statusFilter.label }}</option>
            }
        </select>
        <input type="text"
               [value]="store.documentNumberFilter()"
               placeholder="Belegnummer"
               aria-label="Nach Belegnummer filtern"
               (input)="changeFilter($event)">
        <input type="text"
               [value]="store.recipientFilter()"
               placeholder="Empfänger"
               aria-label="Nach Empfänger filtern"
               (input)="changeRecipientFilter($event)">
    </div>

    <div class="upload-wrapper">
        @if (store.isUploading()) {
            <div aria-live="polite">Datei wird hochgeladen...</div>
        } @else {
            <label for="file-upload">Datei hochladen</label>
            <input id="file-upload" type="file" [disabled]="store.isUploading()" (change)="uploadFile($event)">
        }
    </div>
</div>

<div class="list-wrapper">
    @if (!store.documents().length) {
        <p>Es existieren noch keine Belege</p>
    } @else {
        @for (document of store.filteredDocuments(); track document.id) {
            {{ document | json }}
        } @empty {
            <p>Keine passenden Belege vorhanden</p>
        }
    }
</div>
